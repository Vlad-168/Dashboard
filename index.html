<!doctype html>
<html lang="ru" data-theme="damson">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="config.example.js"></script>
  <script src="config.local.js" onerror="void 0"></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="grain"></span></div>

  <main class="shell">
    <header class="top">
      <div class="hello">
        <p class="eyebrow" id="date"></p>
        <h1 id="greeting">Привет</h1>
        <p class="sub" id="subline"></p>
      </div>
      <div class="clock-wrap">
        <div class="clock" id="clock">00:00</div>
        <div class="top-actions">
          <div class="themes" id="themes" role="radiogroup" aria-label="Тема"></div>
          <button class="icon-btn" id="openSettings" title="Настройки (,)">⚙︎</button>
        </div>
      </div>
    </header>

    <nav class="spaces" id="spaces" role="tablist" aria-label="Пространства"></nav>

    <section class="grid" id="grid"></section>
  </main>

  <!-- Settings -->
  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-inner" id="settingsForm">
      <header class="sheet-head">
        <h2>Настройки</h2>
        <button class="icon-btn" value="cancel" title="Закрыть">✕</button>
      </header>
      <label>Как к тебе обращаться<input name="name" autocomplete="off" /></label>
      <div class="row2">
        <label>GitHub username<input name="ghUser" autocomplete="off" /></label>
        <label>GitHub token <small>(fine‑grained, read‑only)</small><input name="ghToken" type="password" autocomplete="off" placeholder="github_pat_…" /></label>
      </div>
      <label>Пространства <small>(JSON)</small><textarea name="spaces" rows="7" spellcheck="false"></textarea></label>
      <label>Расписание тренировок <small>(JSON: mon…sun)</small><textarea name="schedule" rows="10" spellcheck="false"></textarea></label>
      <p class="err" id="settingsErr"></p>
      <footer class="sheet-foot">
        <button type="button" class="ghost" id="resetSettings">Сбросить к config.local.js</button>
        <button type="submit" class="primary" value="save">Сохранить</button>
      </footer>
    </form>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
