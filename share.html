<!doctype html>
<html lang="en" data-theme="damson">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Schedule</title>
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#1d0f17" />
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png?v=2" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
  <script>
    try { var t = JSON.parse(localStorage.getItem("share.theme")); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="share-page">
  <div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span><span class="floor"></span><span class="grain"></span></div>
  <main class="shell">
    <header class="top">
      <div class="hello">
        <p class="eyebrow" id="sUpdated">Shared schedule</p>
        <h1 id="sTitle">Schedule</h1>
        <p class="sub" id="sSub"></p>
      </div>
      <div class="share-subscribe" id="sSubscribe" hidden>
        <a class="primary" id="sApple">Add to Calendar</a>
        <a class="btn" id="sGoogle" target="_blank" rel="noopener">Google Calendar</a>
      </div>
    </header>
    <section class="grid" id="sGrid"></section>
  </main>
  <script src="js/calendar.js"></script>
  <script src="js/share.js"></script>
</body>
</html>
